name: Lint

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: ['24.x']
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 #v7.1.0
        with:
          node-version: 24.x
      # Node.js 24.x ships with npm <11.11.0 by default, but >=11.11.0 is required
      - run: npm install -g npm@11.11.0
      - name: Install Dependencies
        run: npm install
      - name: Lint
        run: npm run lint

